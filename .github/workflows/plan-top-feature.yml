name: Plan Top Feature

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      head_sha:
        description: "Commit SHA from previous workflow"
        required: false

env:
  OPENAI_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.head_sha || github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone alternatives
        run: python clone_alternatives.py --dest ./sources --depth 1 --workers 4

      - name: Create implementation plan
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Read the writing-plans skill from .agents/skills/writing-plans/SKILL.md and follow its instructions.

            Then:
            1. Find the top-priority feature in docs/FUTURES_FEATURES.md (first feature in the Priority Ranking section, or first feature overall)
            2. Create a comprehensive implementation plan using the writing-plans skill format
            3. Save the plan to docs/superpowers/plans/YYYY-MM-DD-<feature-name>.md (use today's date)

            Announce "I'm using the writing-plans skill to create the implementation plan."

      - name: Check for changes
        id: git-check
        run: |
          git add docs/superpowers/plans/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "tengiz-bot"
          git config user.email "bot@tengiz.dev"
          git commit -m "docs: add implementation plan for top-priority feature"
          git push

      - name: Trigger implement workflow
        run: |
          SHA=$(git rev-parse HEAD)
          gh workflow run implement-top-feature.yml -f head_sha=$SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

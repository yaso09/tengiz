name: Implement Top Feature

on:
  workflow_run:
    workflows: ["Plan Top Feature"]
    types:
      - completed
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}

jobs:
  implement:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone alternatives
        run: python clone_alternatives.py --dest ./sources --depth 1 --workers 4

      - name: Find latest plan
        id: find-plan
        run: |
          PLAN=$(ls -t docs/superpowers/plans/*.md 2>/dev/null | head -1)
          if [ -z "$PLAN" ]; then
            echo "has_plan=false" >> $GITHUB_OUTPUT
          else
            echo "plan_file=$PLAN" >> $GITHUB_OUTPUT
            echo "has_plan=true" >> $GITHUB_OUTPUT
          fi

      - name: Implement plan
        if: steps.find-plan.outputs.has_plan == 'true'
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/deepseek-v4-flash-free
          prompt: |
            Read the implementation plan from ${{ steps.find-plan.outputs.plan_file }}.

            Execute every task in the plan:
            1. Make all code changes specified in each task
            2. Run tests after each task: `go test ./... -v -count=1`
            3. If a test fails, fix it before moving on
            4. Run `go vet ./...` and fix any issues
            5. Update documentation (README.md, AGENTS.md, CLI help texts) if the changes affect CLI commands or behavior
            6. After all tasks are complete, find the implemented feature in docs/FUTURES_FEATURES.md and mark it with:
               - **Status:** ✅ Implemented (use today's date)
               Add this line right after "Why add to Tengiz" line.
            7. Delete the plan file: ${{ steps.find-plan.outputs.plan_file }}
            8. Run `go build -o tengiz .` at the end to verify the build succeeds

            Use Test-Driven Development: write the test first, make it fail, then implement.
            Commit after each passing task with a descriptive conventional commit message.
            If a task's changes are already present in the codebase (check git log), skip to the next task.

      - name: Verify tests and build
        if: always()
        run: |
          go test ./... -v -count=1
          go vet ./...
          go build -o tengiz .

      - name: Check for changes
        id: git-check
        if: always()
        run: |
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "tengiz-bot"
          git config user.email "bot@tengiz.dev"
          git commit -m "feat: implement top-priority feature"
          git push

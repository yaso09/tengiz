name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -v -count=1

      - name: Build (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o tengiz-linux-amd64 .

      - name: Build (linux/arm64)
        run: GOOS=linux GOARCH=arm64 go build -o tengiz-linux-arm64 .

      - name: Build (darwin/amd64)
        run: GOOS=darwin GOARCH=amd64 go build -o tengiz-darwin-amd64 .

      - name: Build (darwin/arm64)
        run: GOOS=darwin GOARCH=arm64 go build -o tengiz-darwin-arm64 .

      - name: Build (windows/amd64)
        run: GOOS=windows GOARCH=amd64 go build -o tengiz-windows-amd64.exe .

      - name: Upload linux/amd64
        uses: actions/upload-artifact@v4
        with:
          name: tengiz-linux-amd64
          path: tengiz-linux-amd64
          if-no-files-found: error

      - name: Upload linux/arm64
        uses: actions/upload-artifact@v4
        with:
          name: tengiz-linux-arm64
          path: tengiz-linux-arm64
          if-no-files-found: error

      - name: Upload darwin/amd64
        uses: actions/upload-artifact@v4
        with:
          name: tengiz-darwin-amd64
          path: tengiz-darwin-amd64
          if-no-files-found: error

      - name: Upload darwin/arm64
        uses: actions/upload-artifact@v4
        with:
          name: tengiz-darwin-arm64
          path: tengiz-darwin-arm64
          if-no-files-found: error

      - name: Upload windows/amd64
        uses: actions/upload-artifact@v4
        with:
          name: tengiz-windows-amd64
          path: tengiz-windows-amd64.exe
          if-no-files-found: error

  build-installer:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        include:
          - os: ubuntu-latest
            asset: tengiz-installer-linux
            ext: ""
          - os: macos-latest
            asset: tengiz-installer-darwin
            ext: ""
          - os: windows-latest
            asset: tengiz-installer-windows
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build installer
        run: pyinstaller --onefile --name tengiz-installer${{ matrix.ext }} installer/install.py

      - name: Upload ${{ matrix.asset }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/tengiz-installer${{ matrix.ext }}
          if-no-files-found: error

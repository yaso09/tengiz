name: Daily Feature Analysis

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone alternatives
        run: python clone_alternatives.py --dest ./sources --depth 1 --workers 4

      - name: Run analysis
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/deepseek-v4-flash-free
          agent: vercel-alt-router
          prompt: |
            Analyze features from open-source Vercel alternatives that should be added to Tengiz (our Go-based Vercel alternative).

            Current Tengiz capabilities:
            - CLI-based deploy (tengiz deploy)
            - Framework auto-detection (Next.js, Vite, Go, Node, Python, static)
            - Docker container management (exec-based, no Docker SDK)
            - Scale-to-zero (configurable idle timeout)
            - Reverse proxy (host-based routing)
            - State persistence (~/.tengiz/*.json)

            Instructions:
            1. Call each expert agent (@coolify-expert, @dokploy-expert, @dokku-expert, @caprover-expert, @kamal-expert, @komodo-expert, @juno-expert)
            2. Ask what valuable features they have that Tengiz is missing and would make sense to add
            3. Compare responses and filter for features suitable for Tengiz's architecture
            4. Check docs/FUTURES_FEATURES.md for already recorded features
            5. Append any new, unrecorded features to the file (mark with [Detected: $(date +%Y-%m-%d)])

            Use this format for each feature:
            ## [Feature Name]
            - **Source:** [alternative name]
            - **Description:** [brief description]
            - **Why add to Tengiz:** [rationale]
            - **Detected:** $(date +%Y-%m-%d)

      - name: Check for changes
        id: git-check
        run: |
          git add docs/FUTURES_FEATURES.md
          if git diff --staged --quiet; then
            echo "No new features detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "tengiz-bot"
          git config user.email "bot@tengiz.dev"
          git commit -m "docs: daily feature analysis update"
          git push

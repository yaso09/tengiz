name: Daily Feature Analysis

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  OPENAI_API_KEY: ${{ secrets.OPENCODE_ZEN_API_KEY }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Clone alternatives
        run: python clone_alternatives.py --dest ./sources --depth 1 --workers 4

      - name: Analyze Coolify
        uses: anomalyco/opencode/github@latest
        with:
          model: opencode/deepseek-v4-flash-free
          agent: coolify-expert
          prompt: |
            Analyze features from Coolify that should be added to Tengiz (our Go-based Vercel alternative).

            Current Tengiz capabilities:
            - CLI-based deploy (tengiz deploy)
            - Framework auto-detection (Next.js, Vite, Go, Node, Python, static)
            - Docker container management (exec-based, no Docker SDK)
            - Scale-to-zero (configurable idle timeout)
            - Reverse proxy (host-based routing)
            - State persistence (~/.tengiz/*.json)

            Instructions:
            1. Analyze the Coolify source code and identify valuable features that Tengiz is missing and would make sense to add
            2. Check docs/FUTURES_FEATURES.md for already recorded features
            3. Append any new, unrecorded features to the file (mark with [Detected: $(date +%Y-%m-%d)])

            Use this format for each feature:
            ## [Feature Name]
            - **Source:** Coolify
            - **Description:** [brief description]
            - **Why add to Tengiz:** [rationale]
            - **Detected:** $(date +%Y-%m-%d)


            - **Why add to Tengiz:** [rationale]
            - **Detected:** $(date +%Y-%m-%d)

      - name: Check for changes
        id: git-check
        run: |
          git add docs/FUTURES_FEATURES.md
          if git diff --staged --quiet; then
            echo "No new features detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes
        if: steps.git-check.outputs.has_changes == 'true'
        run: |
          git config user.name "tengiz-bot"
          git config user.email "bot@tengiz.dev"
          git commit -m "docs: daily feature analysis update"
          git push

      - name: Trigger prioritize workflow
        run: gh workflow run prioritize-features.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

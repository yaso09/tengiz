[project]
name = "tengiz-installer"
version = "0.1.0"
description = "TUI installer for Tengiz - download releases and commit builds"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
tengiz-installer = "installer.__main__:main"

[tool.setuptools.packages.find]
include = ["installer*"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
